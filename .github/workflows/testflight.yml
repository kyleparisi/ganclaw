name: TestFlight

# Uploads the iOS app to TestFlight after the iOS workflow passes on main
# (it only runs when the app changed), or on demand from the Actions tab.
# Setup and secrets: apps/ios/README.md → "TestFlight from GitHub Actions".
on:
  workflow_run:
    workflows: [iOS]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install signing certificate and API key
        env:
          DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          for v in DIST_CERT_P12 DIST_CERT_PASSWORD ASC_KEY_P8 ASC_KEY_ID; do
            test -n "${!v}" || { echo "missing secret for $v"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Turn on push
        if: vars.IOS_PUSH == 'true'
        working-directory: apps/ios
        run: |
          cat > Local.xcconfig <<'EOF'
          GANCLAW_PUSH_ENTITLEMENTS = Ganclaw/Generated/Ganclaw-ios.entitlements
          APNS_ENVIRONMENT = production
          EOF

      - name: Archive and upload to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GANCLAW_SIGN_IDENTITY: Apple Distribution
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          status=0
          apps/ios/tools/testflight.sh --upload > "$RUNNER_TEMP/testflight.log" 2>&1 || status=$?
          grep -E "error:|warning: .*(sign|profile)|\*\* (ARCHIVE|EXPORT) |^==>|Uploaded" "$RUNNER_TEMP/testflight.log" || true
          test "$status" -eq 0 || { tail -80 "$RUNNER_TEMP/testflight.log"; exit 1; }
          echo "Uploaded commit $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          grep Uploaded "$RUNNER_TEMP/testflight.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-log
          path: ${{ runner.temp }}/testflight.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          test -z "${KEYCHAIN:-}" || security delete-keychain "$KEYCHAIN" || true
