name: iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "internal/appchannel/**"
      - "internal/store/**"
      - "internal/router/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "internal/appchannel/**"
      - "internal/store/**"
      - "internal/router/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build, unit tests and control-server tests
        run: apps/ios/test/run.sh
        env:
          ARTIFACTS: ${{ runner.temp }}/ios-artifacts
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: ${{ runner.temp }}/ios-artifacts
          if-no-files-found: ignore

  mac:
    # The desktop app: the same SwiftUI app built with Mac Catalyst,
    # ad-hoc signed (no Developer ID in this repo yet).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build Ganclaw.app (Mac Catalyst, Release)
        working-directory: apps/ios
        run: |
          tools/gencap/run.sh "$PWD" --check
          xcodegen generate --quiet
          xcodebuild -project Ganclaw.xcodeproj -scheme Ganclaw -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee build-mac.log | grep -E "error:|\*\* BUILD " || true
          test "${PIPESTATUS[0]}" -eq 0 || { tail -50 build-mac.log; exit 1; }
      - name: Check and package
        working-directory: apps/ios
        run: |
          APP=build/mac/Build/Products/Release-maccatalyst/Ganclaw.app
          lipo -info "$APP/Contents/MacOS/Ganclaw"
          codesign --verify --deep --strict "$APP" && codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|flags"
          # Without these the hardened runtime kills the app when it opens
          # the mic or camera (the bug the first Mac build shipped with).
          # The signed app must carry exactly the manifest's entitlements
          # (Platform/Capability.swift), plus what codesign adds itself.
          codesign -d --entitlements - --xml "$APP" 2>/dev/null > /tmp/ent.plist
          python3 - /tmp/ent.plist "$(tools/gencap/run.sh --entitlements 2>/dev/null || true)" <<'PY'
          import plistlib, sys
          signed = set(plistlib.load(open(sys.argv[1], "rb")))
          signed.discard("com.apple.security.get-task-allow")
          want = set(sys.argv[2].split())
          assert want, "gencap printed no entitlements"
          if signed != want:
              sys.exit(f"entitlement mismatch: missing {sorted(want - signed)}, unexpected {sorted(signed - want)}")
          print("entitlements match the manifest:", sorted(signed))
          PY
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          mkdir -p dist && ditto -c -k --keepParent "$APP" dist/Ganclaw-mac.zip
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Ganclaw-mac
          path: apps/ios/dist/Ganclaw-mac.zip
