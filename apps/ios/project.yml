name: Ganclaw
options:
  bundleIdPrefix: com.kyleparisi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Ganclaw:
    type: application
    platform: iOS
    sources:
      - path: Ganclaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw
        PRODUCT_NAME: Ganclaw
        INFOPLIST_FILE: Ganclaw/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac app is this app built with Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CONTROL_SERVER
  GanclawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GanclawTests
    dependencies:
      - target: Ganclaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ganclaw.app/Ganclaw
schemes:
  Ganclaw:
    build:
      targets:
        Ganclaw: all
        GanclawTests: [test]
    test:
      targets:
        - GanclawTests
