name: Ganclaw
options:
  bundleIdPrefix: com.kyleparisi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Ganclaw:
    type: application
    platform: iOS
    sources:
      - path: Ganclaw
    configFiles:
      Debug: Push.xcconfig
      Release: Push.xcconfig
    preBuildScripts:
      - name: Generate capability declarations
        # Info.plist usage strings and Mac entitlements come from
        # Platform/Capability.swift; regenerate before every build so the
        # signed app always declares what the code uses.
        script: |
          GENCAP_BIN="$DERIVED_FILE_DIR/gencap" "$SRCROOT/tools/gencap/run.sh" "$SRCROOT"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw
        PRODUCT_NAME: Ganclaw
        # Push is opt-in (Push.xcconfig): empty means no entitlements file.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(GANCLAW_PUSH_ENTITLEMENTS)
        INFOPLIST_FILE: Ganclaw/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # gencap writes Info.plist and the entitlements file in the source tree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CONTROL_SERVER
  GanclawMac:
    # The native macOS app. It shares the iOS app's model, networking and
    # platform layers and its message views; GanclawMac/ holds the Mac
    # window (sidebar + thread), composer, attach sheet and Settings.
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Ganclaw/Model
      - path: Ganclaw/Net
      - path: Ganclaw/Platform
        excludes:
          - ComposerTextView.swift # UIKit; the Mac composer is GanclawMac/MacComposerField.swift
      - path: Ganclaw/Control/ControlRegistry.swift
      - path: Ganclaw/Views
        excludes:
          - RootView.swift
          - AttachSheet.swift
          - ThreadView.swift
      - path: Ganclaw/Assets.xcassets
      - path: GanclawMac
    preBuildScripts:
      - name: Generate capability declarations
        script: |
          GENCAP_BIN="$DERIVED_FILE_DIR/gencap" "$SRCROOT/tools/gencap/run.sh" "$SRCROOT"
        basedOnDependencyAnalysis: false
    settings:
      base:
        # Same bundle ID as the iOS app: on the App Store it is the macOS
        # half of one universal-purchase record.
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw
        PRODUCT_NAME: Ganclaw
        INFOPLIST_FILE: GanclawMac/Info.plist
        # App Sandbox is required by the Mac App Store; the mic also needs
        # audio-input under the hardened runtime.
        CODE_SIGN_ENTITLEMENTS: Ganclaw/Generated/Ganclaw-mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
  GanclawMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Ganclaw/Platform/PasteboardClient.swift
      - path: Ganclaw/Platform/PastedImage.swift
      - path: Ganclaw/Platform/Live/MacPasteboard.swift
      - path: GanclawMac/MacComposerField.swift
      - path: GanclawMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw.mactests
        GENERATE_INFOPLIST_FILE: YES
  GanclawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GanclawTests
    dependencies:
      - target: Ganclaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleparisi.ganclaw.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ganclaw.app/Ganclaw
schemes:
  Ganclaw:
    build:
      targets:
        Ganclaw: all
        GanclawTests: [test]
    test:
      targets:
        - GanclawTests
  GanclawMac:
    build:
      targets:
        GanclawMac: all
        GanclawMacTests: [test]
    test:
      targets:
        - GanclawMacTests
